function $(id){ return document.getElementById(id); }

function comExt(n){
  var i = n.lastIndexOf('.');
  return i > 0 ? n.slice(i) : '';
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function escAttr(s){
  return String(s == null ? '' : s)
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function escapeRegex(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function norm(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

function debounce(fn, ms){
  var t;
  return function(){
    var self = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(self, args); }, ms);
  };
}

/* ============================================================

function toast(msg, tipo){
  var wrap = $('toastWrap');
  if(!wrap) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (tipo || 'i');
  var ic = { s:'✅', e:'❌', w:'⚠️', i:'ℹ️', b:'🧠', save:'💾' };
  el.textContent = (ic[tipo] || 'ℹ️') + ' ' + msg;
  wrap.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'all .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-20px)';
    setTimeout(function(){ el.remove(); }, 300);
  }, 3500);
}

function modalConfirm(msg, title){
  return new Promise(function(resolve){
    var ov = $('modalOverlay');
    var tit = $('modalTitle');
    var m = $('modalMsg');
    var inp = $('modalInput');
    var ok = $('modalOk');
    var cancel = $('modalCancel');
    tit.textContent = title || 'Confirmação';
    m.textContent = msg;
    inp.style.display = 'none';
    ov.classList.add('on');
    function fechar(v){
      ov.classList.remove('on');
      ok.onclick = null; cancel.onclick = null; ov.onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(v);
    }
    function onKey(e){
      if(e.key === 'Escape') fechar(false);
      if(e.key === 'Enter') fechar(true);
    }
    document.addEventListener('keydown', onKey);
    ok.onclick = function(){ fechar(true); };
    cancel.onclick = function(){ fechar(false); };
    ov.onclick = function(e){ if(e.target === ov) fechar(false); };
  });
}

  if(!el) return;
  el.className = 'save-status ' + status;
  if(status === 'saving'){
    el.textContent = '⏳ Salvando...';
  } else if(status === 'saved'){
    el.textContent = '✅ Salvo!';
    setTimeout(function(){
      el.textContent = '💾 Pronto';
      el.className = 'save-status';
    }, 2000);
  } else {
    el.textContent = '💾 Pronto';
  }
}

    if(rawArt){ try{ arrArt = JSON.parse(rawArt); }catch(e){} }

            arrArt = arrBackup;
            setTimeout(function(){ toast('♻️ Artistas recuperados do backup', 's'); }, 1000);
          }

    }

    if(arrArt && Array.isArray(arrArt) && arrArt.length > 0){
      artistasConhecidos = {};
      arrArt.forEach(function(a){
        if(a && typeof a === 'string') artistasConhecidos[norm(a)] = a;

/* ============================================================
   8. CACHE DE REGEX (lixo + artistas)
   ============================================================ */
function getRegexLixo(){
  var todas = LIXO_BASE.concat(Object.keys(brain.lixo));
  var hash = todas.slice().sort().join('|');
  if(_cacheRegexLixo && _cacheHashLixo === hash) return _cacheRegexLixo;

  var LOTE = 50;
  var regexes = [];
  var vistos = {};
  var unicas = todas.filter(function(p){
    var k = norm(p);
    if(!k || vistos[k]) return false;
    vistos[k] = true; return true;
  }).sort(function(a,b){ return b.length - a.length; });

  for(var i = 0; i < unicas.length; i += LOTE){
    var lote = unicas.slice(i, i + LOTE);
    var padrao = lote.map(function(p){ return escapeRegex(p); }).join('|');
    regexes.push(new RegExp('(^|[\\s\\-_\\/|,;:.!?()\\[\\]])(' + padrao + ')([\\s\\-_\\/|,;:.!?()\\[\\]]|$)', 'gi'));
  }

  _cacheRegexLixo = regexes;
  _cacheHashLixo = hash;
  return regexes;
}

function getRegexArtistas(){
  var chaves = Object.keys(artistasConhecidos).filter(function(k){ return k.length >= 3; });
  var hash = chaves.slice().sort().join('|');
  if(_cacheRegexArt && _cacheHashArt === hash) return _cacheRegexArt;

  chaves.sort(function(a,b){ return b.length - a.length; });
  var LOTE = 50;
  var regexes = [];
  for(var i = 0; i < chaves.length; i += LOTE){
    var lote = chaves.slice(i, i + LOTE);
    var padrao = lote.map(function(k){ return escapeRegex(k); }).join('|');
    regexes.push({
      re: new RegExp('(^|[\\s\\-_\\/|,;:.!?()\\[\\]])(' + padrao + ')([\\s\\-_\\/|,;:.!?()\\[\\]]|$)', 'i'),
      lote: lote
    });
  }
  _cacheRegexArt = regexes;
  _cacheHashArt = hash;
  return regexes;
}

/* ============================================================
   9. LIMPEZA
   ============================================================ */
function removerNumeros(s){
  if(!s) return '';
  return String(s).replace(/\b\d+\b/g,' ').replace(/\d+/g,' ').replace(/\s+/g,' ').trim();
}

function removerSimbolos(s){
  s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,' ');
  s = s.replace(/[♪♫♬♭♮♯🎤🎶🎵🎧🎼]/g,' ');
  s = s.replace(/[\u00A0\u200B\u200C\u200D\uFEFF\u200E\u200F\u2028\u2029]/g,' ');
  return s;
}

function limparPalavras(s){
  if(!s) return '';
  var regexes = getRegexLixo();
  for(var i = 0; i < regexes.length; i++){
    s = s.replace(regexes[i], ' ');
  }
  s = s.replace(/\b\d+\s*kbps\b/gi,' ');
  return s;
}

function limpar(txt){
  if(!txt) return '';
  var s = String(txt).replace(/_/g,' ');
  s = removerSimbolos(s);
  s = s.replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ');
  s = limparPalavras(s);
  s = removerNumeros(s);
  s = s.replace(/[!?'"`´~^*#@$%&=+,;:]+/g,' ');
  s = s.replace(/\s*[-–—]\s*$/,' ').replace(/^\s*[-–—]\s*/,' ');
  s = s.replace(/\s+/g,' ').replace(/^[\s\-–—_,;:.]+/,'').replace(/[\s\-–—_,;:]+$/,'');
  return s.trim();
}

function ehLixo(t){
  if(!t) return true;
  var x = norm(t);
  if(!x) return true;
  if(/^\d+[\s._-]*kbps/.test(x)) return true;
  if(/^[\d\s.\-_]+$/.test(x)) return true;
  return false;
}

function tagPareceCanal(txt){
  if(!txt) return false;
  return /\b(sem filtro|oficial|canal|records|studio|estúdio|estudio|tv|web|play|top|best|hits|coletânea|coletanea|various|compilation|playlist|prod)\b/i.test(txt);
}

/* ============================================================
   10. ABREVIAÇÃO
   ============================================================ */
function abreviarPalavra(p){
  if(!p) return p;
  var chave = norm(p);
  if(abrev[chave]) return abrev[chave];
  if(p.length <= 4) return p;
  if(p.length <= 6){
    var semVogais = p.charAt(0) + p.slice(1, -1).replace(/[aeiouáéíóúâêôãõà]/gi,'') + p.slice(-1);
    if(semVogais.length >= 3 && semVogais.length < p.length) return semVogais;
    return p;
  }
  return p.slice(0, 5) + '.';
}

function abreviarTexto(txt, limite){
  if(!txt) return '';
  if(txt.length <= limite) return txt;
  var palavras = txt.split(/\s+/);
  var abreviado = palavras.map(function(p){
    var m = p.match(/^([\/\-–—(]?)([A-Za-zÀ-Ýà-ÿ]+)([\/\-–—),.]?)$/);
    if(!m) return p;
    return m[1] + abreviarPalavra(m[2]) + m[3];
  }).join(' ');
  if(abreviado.length <= limite) return abreviado;
  var palavras2 = abreviado.split(/\s+/);
  while(palavras2.length > 2 && palavras2.join(' ').length > limite) palavras2.pop();
  abreviado = palavras2.join(' ');
  if(abreviado.length > limite){
    var corte = abreviado.slice(0, limite);
    var ultimoEspaco = corte.lastIndexOf(' ');
    abreviado = ultimoEspaco > limite * 0.5 ? corte.slice(0, ultimoEspaco) : corte;
  }
  return abreviado.trim();
}

function capitalizar(s){
  if(!s) return '';
  return s.split(/\s+/).map(function(p){
    if(p.length <= 2 && /^(de|da|do|das|dos|e|o|a|os|as|em|no|na)$/i.test(p)) return p.toLowerCase();
    return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
  }).join(' ');
}

/* ============================================================
   11. ARTISTAS (normalização + busca)
   ============================================================ */
function normalizarComAlias(nome){
  if(!nome) return nome;
  var k = norm(nome);
  if(aliases[k]) return aliases[k];
  if(artistasConhecidos[k]) return artistasConhecidos[k];
  return nome;
}

function encontrarArtistaEm(txt){
  if(!txt) return null;
  var n = norm(txt);
  var regexes = getRegexArtistas();
  for(var i = 0; i < regexes.length; i++){
    var m = n.match(regexes[i].re);
    if(m){
      var match = m[2];
      var chaves = Object.keys(artistasConhecidos);
      for(var j = 0; j < chaves.length; j++){
        if(norm(artistasConhecidos[chaves[j]]) === match) return artistasConhecidos[chaves[j]];
      }
    }
  }
  var chavesAlias = Object.keys(aliases).sort(function(a,b){ return b.length - a.length; });
  for(var k = 0; k < chavesAlias.length; k += 50){
    var lote = chavesAlias.slice(k, k + 50);
    var padrao = lote.map(function(x){ return escapeRegex(x); }).join('|');
    var re = new RegExp('(^|[\\s\\-_\\/|,;:.!?()\\[\\]])(' + padrao + ')([\\s\\-_\\/|,;:.!?()\\[\\]]|$)', 'i');
    var mm = n.match(re);
    if(mm){
      var match2 = mm[2];
      for(var l = 0; l < chavesAlias.length; l++){
        if(chavesAlias[l] === match2) return aliases[chavesAlias[l]];
      }
    }
  }
  return null;
}

/* ============================================================
   12. PARSER DE NOME
   ============================================================ */
function removerArtistaDoTitulo(title, artist){
  if(!title || !artist) return title;
  var re = new RegExp('^' + escapeRegex(artist) + '\\s*[-–—:/|]\\s*','i');
  var out = title.replace(re,'').trim();
  return out.length < 3 ? title : out;
}

function parseTracoFrente(nomeBase){
  var m = String(nomeBase).match(/^\s*[-–—]\s*(.+?)\s*[-–—]\s*(.+)$/);
  if(!m) return null;
  return { artista: m[1].trim(), titulo: m[2].trim() };
}

function parseNome(nome){
  var base = String(nome).replace(/\.[^.]+$/,'');

  // 1) Regra do traço na frente: -Artista-Titulo
  var forca = parseTracoFrente(base);
  if(forca){
    var a = limpar(forca.artista);
    var t = limpar(forca.titulo);
    if(a){
      a = normalizarComAlias(a);
      var aNorm = norm(a);
      if(brain.artistas[aNorm]) a = brain.artistas[aNorm];
    }
    if(t){
      var tNorm = norm(t);
      if(brain.titulos[tNorm]) t = brain.titulos[tNorm];
    }
    if(!t) t = a;
    t = removerArtistaDoTitulo(t, a);
    return { a: capitalizar(a), t: capitalizar(t) };
  }

  // 2) Parser normal
  var s = base.replace(/_/g,' ').replace(/\s+/g,' ').trim();
  s = s.replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ');
  s = s.replace(/\s+/g,' ').trim();
  s = limparPalavras(s);
  s = removerNumeros(s);
  s = s.replace(/\b\d+\s*kbps\b/gi,' ');
  s = s.replace(/\s+/g,' ').trim();

  // Separa feat/part/com
  var featMatch = s.match(FEAT_RE);
  var featTrecho = '';
  if(featMatch){
    featTrecho = s.slice(featMatch.index).trim();
    s = s.slice(0, featMatch.index).trim();
  }

  var artistaConhecido = encontrarArtistaEm(s);
  var artistaDetectado = '';
  var tituloDetectado = '';

  var partes = s.split(/\s*[+\-–—]\s*/).filter(function(p){ return p.trim().length > 0; });
  partes = partes.map(function(p){ return limpar(p); }).filter(function(p){ return p && !ehLixo(p); });

  if(artistaConhecido){
    artistaDetectado = artistaConhecido;
    var restoTitulo = partes.filter(function(p){
      var pn = norm(p), an = norm(artistaConhecido);
      return pn !== an && pn.indexOf(an) === -1 && an.indexOf(pn) === -1;
    }).join(' ');
    tituloDetectado = restoTitulo ? limpar(restoTitulo) : limpar(s);
  } else if(partes.length >= 2){
    var p1 = partes[0], p2 = partes[1];
    var w1 = p1.split(/\s+/).length, w2 = p2.split(/\s+/).length;

    if(w2 <= 2 && w1 >= 3){ artistaDetectado = p2; tituloDetectado = p1; }
    else if(w1 <= 2 && w2 >= 3){ artistaDetectado = p1; tituloDetectado = p2; }
    else if(w1 <= 2 && w2 <= 2){ artistaDetectado = p1; tituloDetectado = partes.slice(1).join(' '); }
    else { artistaDetectado = p1; tituloDetectado = partes.slice(1).join(' '); }
  } else if(partes.length === 1){
    var mm = s.match(/^(.+?)\s+[-–—]\s+(.+)$/);
    if(mm){ artistaDetectado = limpar(mm[1]); tituloDetectado = limpar(mm[2]); }
    else { tituloDetectado = partes[0]; }
  }

  if(featTrecho){
    tituloDetectado = (tituloDetectado ? tituloDetectado + ' ' : '') + limpar(featTrecho);
  }

  if(artistaDetectado){
    artistaDetectado = normalizarComAlias(artistaDetectado);
    var aNorm2 = norm(artistaDetectado);
    if(brain.artistas[aNorm2]) artistaDetectado = brain.artistas[aNorm2];
  }
  if(tituloDetectado){
    var tNorm2 = norm(tituloDetectado);
    if(brain.titulos[tNorm2]) tituloDetectado = brain.titulos[tNorm2];
  }
  if(!tituloDetectado) tituloDetectado = limpar(s);

  // Evita artist === title (fallback circular)
  if(artistaDetectado && tituloDetectado && norm(artistaDetectado) === norm(tituloDetectado)){
    artistaDetectado = '';
  }

  tituloDetectado = removerArtistaDoTitulo(tituloDetectado, artistaDetectado);
  return { a: capitalizar(artistaDetectado), t: capitalizar(tituloDetectado) };
}

/* ============================================================
   13. LEITURA DE TAGS (MP3 ID3v2 + OPUS/OGG Vorbis binário)
   ============================================================ */
function lerTags(file, cb){
  if(!file){ cb(null); return; }
  var ext = comExt(file.name).toLowerCase();
  if(ext !== '.mp3' && ext !== '.opus' && ext !== '.ogg'){ cb(null); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var buf = e.target.result;
      var v = new DataView(buf);
      var tags = { artist:'', title:'', genre:'' };

      // MP3 ID3v2
      if(ext === '.mp3' && v.byteLength >= 10 &&
         v.getUint8(0)===0x49 && v.getUint8(1)===0x44 && v.getUint8(2)===0x33){
        var tagSize = ((v.getUint8(6)&0x7F)<<21)|((v.getUint8(7)&0x7F)<<14)|((v.getUint8(8)&0x7F)<<7)|(v.getUint8(9)&0x7F);
        var total = Math.min(10 + tagSize, v.byteLength);
        var dec = new TextDecoder('utf-8');
        var off = 10;
        while(off < total - 10){
          try{
            var fid = String.fromCharCode(v.getUint8(off),v.getUint8(off+1),v.getUint8(off+2),v.getUint8(off+3));
            var fsz = (v.getUint8(off+4)<<24)|(v.getUint8(off+5)<<16)|(v.getUint8(off+6)<<8)|v.getUint8(off+7);
            if(fsz <= 0 || fsz > 500000 || off+10+fsz > total) break;
            if(fid==='TIT2' || fid==='TPE1' || fid==='TCON'){
              var enc = v.getUint8(off+10);
              var bytes = new Uint8Array(buf, off+11, fsz-1);
              var txt = '';
              if(enc===0 || enc===3){ txt = dec.decode(bytes); }
              else {
                var cc = [];
                for(var k=0;k+1<bytes.length;k+=2) cc.push(String.fromCharCode(bytes[k]|(bytes[k+1]<<8)));
                txt = cc.join('');
              }
              txt = txt.replace(/\0/g,'').replace(/^\uFEFF/,'').trim();
              if(fid==='TIT2') tags.title = txt;
              if(fid==='TPE1') tags.artist = txt;
              if(fid==='TCON') tags.genre = txt;
            }
            off += 10 + fsz;
          }catch(err){ break; }
        }
      }

      // OPUS/OGG Vorbis comment (binário)
      if((ext === '.opus' || ext === '.ogg') && v.byteLength > 16){
        var bytes2 = new Uint8Array(buf);
        var idx = -1;
        // "OpusTags"
        var magic = [0x4F,0x70,0x75,0x73,0x54,0x61,0x67,0x73];
        for(var i = 0; i + 8 <= bytes2.length; i++){
          if(bytes2[i]===magic[0] && bytes2[i+1]===magic[1] && bytes2[i+2]===magic[2] && bytes2[i+3]===magic[3] &&
             bytes2[i+4]===magic[4] && bytes2[i+5]===magic[5] && bytes2[i+6]===magic[6] && bytes2[i+7]===magic[7]){
            idx = i + 8; break;
          }
        }
        // "\x03vorbis"
        if(idx === -1){
          var mv = [0x03,0x76,0x6F,0x72,0x62,0x69,0x73];
          for(var i2 = 0; i2 + 7 <= bytes2.length; i2++){
            if(bytes2[i2]===mv[0] && bytes2[i2+1]===mv[1] && bytes2[i2+2]===mv[2] && bytes2[i2+3]===mv[3] &&
               bytes2[i2+4]===mv[4] && bytes2[i2+5]===mv[5] && bytes2[i2+6]===mv[6]){
              idx = i2 + 7; break;
            }
          }
        }
        if(idx >= 0 && idx + 4 <= bytes2.length){
          var dv = new DataView(buf);
          var vendorLen = dv.getUint32(idx, true); idx += 4;
          if(idx + vendorLen + 4 <= bytes2.length){
            idx += vendorLen;
            var commentCount = dv.getUint32(idx, true); idx += 4;
            var dec2 = new TextDecoder('utf-8');
            for(var c = 0; c < commentCount && idx + 4 <= bytes2.length; c++){
              var len = dv.getUint32(idx, true); idx += 4;
              if(idx + len > bytes2.length) break;
              var txt2 = dec2.decode(bytes2.subarray(idx, idx + len));
              idx += len;
              var eq = txt2.indexOf('=');
              if(eq <= 0) continue;
              var key = txt2.slice(0, eq).toUpperCase();
              var val = txt2.slice(eq + 1).trim();
              if(!val) continue;
              if(key === 'TITLE') tags.title = val;
              if(key === 'ARTIST') tags.artist = val;
              if(key === 'GENRE') tags.genre = val;
            }
          }
        }
      }

      cb(tags);
    }catch(err){ cb(null); }
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsArrayBuffer(file.slice(0, 2 * 1024 * 1024));
}

/* ============================================================
   14. ESCRITA DE TAGS (preserva capa/álbum)
   ============================================================ */
function escreverTags(buffer, tags){
  if(typeof ID3Writer === 'undefined') return buffer;
  try{
    var w = new ID3Writer(buffer);
    var preservar = {};
    try{
      var old = w.parseTag ? w.parseTag() : null;
      if(old && old.frames){
        ['APIC','TALB','TRCK','TYER','TPOS','TCOM','TPE2'].forEach(function(fid){
          var f = old.frames.find(function(x){ return x.id === fid; });
          if(f) preservar[fid] = f;
        });
      }
    }catch(e){}

    try{ w.removeTag(); }catch(e){}

    if(tags.title)  w.setFrame('TIT2', tags.title);
    if(tags.artist) w.setFrame('TPE1', tags.artist);
    if(tags.genre)  w.setFrame('TCON', tags.genre);

    Object.keys(preservar).forEach(function(fid){
      try{
        var f = preservar[fid];
        if(fid === 'APIC' && f.picture){
          w.setFrame('APIC', { type: f.picture.type || 3, data: f.picture.data, description: f.picture.description || '' });
        } else if(fid !== 'APIC' && f.value != null){
          w.setFrame(fid, f.value);
        }
      }catch(e){}
    });

    return w.addTag();
  }catch(err){
    console.error('Erro ID3:', err);
    return buffer;
  }
}

/* ============================================================
   15. SANITIZE + GERAR NOME (Artista_Titulo.ext)
   ============================================================ */
function sanitize(s){
  if(!s) return '';
  var x = String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  x = x.replace(/[^A-Za-z0-9\s\-_]/g,'');
  x = x.replace(/\s+/g,'_').replace(/_+/g,'_');
  x = x.replace(/-+/g,'-');
  x = x.replace(/^[_\-.]+|[_\-.]+$/g,'');
  return x;
}

function gerarNome(m, ext){
  var art = sanitize(m.artist) || 'desconhecido';
  var tit = sanitize(m.title) || 'sem_titulo';
  var limiteSemExt = LIMITE_NOME - ext.length;
  if(limiteSemExt < 15) limiteSemExt = 15;

  if(norm(art) === norm(tit)){
    var so = tit;
    if(so.length > limiteSemExt) so = sanitize(abreviarTexto(m.title, limiteSemExt));
    return so + ext;
  }

  var nomeCompleto = art + '_' + tit;
  if(nomeCompleto.length <= limiteSemExt) return nomeCompleto + ext;

  var espacoTit = limiteSemExt - art.length - 1;
  if(espacoTit < 10) espacoTit = Math.floor(limiteSemExt * 0.45);
  var tAbrev = sanitize(abreviarTexto(m.title, espacoTit));
  if(!tAbrev) tAbrev = tit.slice(0, espacoTit);

  nomeCompleto = art + '_' + tAbrev;
  if(nomeCompleto.length > limiteSemExt){
    var espacoArt = limiteSemExt - tAbrev.length - 1;
    if(espacoArt < 5) espacoArt = 5;
    var aAbrev = sanitize(abreviarTexto(m.artist, espacoArt));
    if(!aAbrev) aAbrev = art.slice(0, espacoArt);
    nomeCompleto = aAbrev + '_' + tAbrev;
  }
  if(nomeCompleto.length > limiteSemExt){
    nomeCompleto = nomeCompleto.slice(0, limiteSemExt).replace(/[_\-.]+$/,'');
  }
  return nomeCompleto + ext;
}

/* ============================================================
   16. APRENDIZADO
   ============================================================ */
function aprenderLixo(textoOriginal, textoLimpo){
  if(!textoOriginal) return;
  var orig = String(textoOriginal).trim();
  var limpoNorm = norm(textoLimpo || '');
  var palavras = orig.split(/\s+/).filter(Boolean);
  var aprendidos = [];
  palavras.forEach(function(p){
    var pn = norm(p).replace(/[^\w\s]/g,'').trim();
    if(!pn || pn.length < 3) return;
    if(limpoNorm.indexOf(pn) === -1){
      if(!brain.lixo[pn] && !ehLixo(pn) && pn.length <= 30){
        brain.lixo[pn] = true;
        aprendidos.push(p);
      }
    }
  });
  if(aprendidos.length){
    _cacheHashLixo = '';
    salvarBrain();
    toast('🧠 Aprendi: ' + aprendidos.slice(0,3).join(', ') + (aprendidos.length > 3 ? '...' : ''), 'b');
  }
}

function aprenderArtista(nome){
  if(!nome) return;
  var n = String(nome).trim();
  if(n.length < 2) return;
  var chave = norm(n);
  if(brain.artistas[chave] !== n){ brain.artistas[chave] = n; salvarBrain(); }
  if(!artistasConhecidos[chave]){
    artistasConhecidos[chave] = n;
    _cacheHashArt = '';
    _dirtyArtistas = true;
    if(salvarArtistas()) toast('🎨 Artista salvo: ' + n, 'save');
  }
}

function aprenderTitulo(nome){
  if(!nome) return;
  var n = String(nome).trim();
  if(n.length < 2) return;
  var chave = norm(n);
  if(brain.titulos[chave] !== n){
    brain.titulos[chave] = n;
    salvarBrain();
    toast('🧠 Título salvo: ' + n.substring(0,40), 'b');
  }
}

/* ============================================================
   17. ADD ARQUIVOS
   ============================================================ */
function addArquivos(fileList){
  var arr = [];
  for(var i = 0; i < fileList.length; i++){
    if(/\.(mp3|opus|m4a|flac|ogg|wav)$/i.test(fileList[i].name)) arr.push(fileList[i]);
  }
  if(arr.length === 0){ toast('Nenhum arquivo suportado.', 'e'); return; }
  toast('Lendo ' + arr.length + ' arquivo(s)...', 'i');

  var vistos = {};
  var naoDup = arr.filter(function(f){
    var k = f.name + '|' + f.size;
    if(vistos[k]) return false;
    vistos[k] = true; return true;
  });
  if(naoDup.length < arr.length){
    toast('⚠️ ' + (arr.length - naoDup.length) + ' duplicado(s) ignorado(s)', 'w');
  }

  var pendentes = naoDup.length;
  if(pendentes === 0) return;

  function concluir(){
    pendentes--;
    if(pendentes === 0){
      render();
      toast('✅ ' + naoDup.length + ' arquivo(s) carregado(s)', 's');
    }
  }

  naoDup.forEach(function(file){
    var respondeu = false;
    function finalizar(){ if(!respondeu){ respondeu = true; concluir(); } }
    var timeout = setTimeout(finalizar, 30000);
    try{
      var p = parseNome(file.name);
      lerTags(file, function(tags){
        clearTimeout(timeout);
        try{
          var tagArtist = (tags && tags.artist) ? limpar(tags.artist) : '';
          var tagTitle  = (tags && tags.title)  ? limpar(tags.title)  : '';
          var tagGenero = (tags && tags.genre) ? tags.genre : '';

          var artist, title;
          var pNorm = norm(p.a);
          if(brain.artistas[pNorm]) artist = brain.artistas[pNorm];
          else if(tagArtist && !tagPareceCanal(tagArtist) && !ehLixo(tagArtist)) artist = tagArtist;
          else artist = p.a;

          artist = normalizarComAlias(artist);

          var tNorm = norm(p.t);
          if(brain.titulos[tNorm]) title = brain.titulos[tNorm];
          else if(tagTitle && !ehLixo(tagTitle) && !tagPareceCanal(tagTitle)) title = tagTitle;
          else title = p.t;

          title = removerArtistaDoTitulo(title, artist);

          var m = {
            id: 'm_' + (++idc) + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
            file: file,
            originalName: file.name,
            artist: artist || '',
            title: title || '',
            genero: tagGenero || '',
            corrompido: ehLixo(artist) || ehLixo(title) || norm(artist) === norm(title)
          };
          m.newName = gerarNome(m, comExt(file.name));
          musicas.push(m);
          mapMusicas.set(m.id, m);
        }catch(e){ console.error('Erro processando arquivo:', e); }
        finalizar();
      });
    }catch(e){
      clearTimeout(timeout);
      finalizar();
    }
  });
}

/* ============================================================
   18. RENDER
   ============================================================ */
function render(){
  var corpo = $('corpo');
  var vazio = $('vazioCard');

  if(musicas.length === 0){
    vazio.style.display = 'block';
    corpo.innerHTML = '';
    stats();
    atualizarJson();
    return;
  }
  vazio.style.display = 'none';

  var html = '';
  for(var i = 0; i < musicas.length; i++){
    var m = musicas[i];
    var cls = m.corrompido ? 'cor' : '';
    var st = m.corrompido ? '⚠️' : '✅';
    html += '<div class="card-mus ' + cls + '" data-mid="' + m.id + '">' +
      '<div class="topo">' +
        '<span class="num">' + (i+1) + '</span>' +
        '<span class="orig" title="' + escAttr(m.originalName) + '">' + esc(m.originalName) + '</span>' +
        '<span class="st">' + st + '</span>' +
      '</div>' +
      '<div class="campos">' +
        '<div class="campo"><label>Artista</label>' +
          '<input data-id="' + m.id + '" data-campo="artist" value="' + escAttr(m.artist) + '" placeholder="Artista"></div>' +
        '<div class="campo"><label>Título</label>' +
          '<input data-id="' + m.id + '" data-campo="title" value="' + escAttr(m.title) + '" placeholder="Título"></div>' +
        '<div class="campo"><label>Gênero</label>' +
          '<input data-id="' + m.id + '" data-campo="genero" value="' + escAttr(m.genero) + '" placeholder="Gênero"></div>' +
      '</div>' +
      '<div class="novo-nome" title="' + escAttr(m.newName) + '"><b>→</b> ' + esc(m.newName) + '</div>' +
    '</div>';
  }
  corpo.innerHTML = html;
  stats();
  atualizarJson();
}

function onInputEdit(e){
  var inp = e.target;
  if(!inp.dataset || !inp.dataset.id) return;
  var m = mapMusicas.get(inp.dataset.id);
  if(!m) return;
  m[inp.dataset.campo] = inp.value;
  if(inp.dataset.campo === 'artist' || inp.dataset.campo === 'title'){
    m.corrompido = ehLixo(m.artist) || ehLixo(m.title) || norm(m.artist) === norm(m.title);
    m.newName = gerarNome(m, comExt(m.originalName));
    var card = inp.closest('.card-mus');
    if(card){

function _atualizarJsonReal(){
  var txt = $('jsonTexto');
  var badge = $('jsonBadge');
  var info = $('jsonInfo');
  var tam = $('jsonTamanho');
  if(!txt) return;

  var ativo = document.activeElement;
  if(ativo && ativo !== txt && (ativo.tagName === 'INPUT' || ativo.tagName === 'TEXTAREA')) return;

  if(musicas.length === 0){
    txt.value = '';
    txt.placeholder = 'Adicione músicas para gerar o JSON...';
    badge.textContent = '0';
    info.textContent = 'Aguardando músicas...';
    info.style.color = '';
    tam.textContent = '0 chars';
    jsonAtual = '';
    return;
  }

  var idIni = parseInt($('idInicial').value, 10) || 1;
  var gen = $('generoGeral').value.trim() || 'Music';

  var arr = musicas.map(function(m, i){
    return {
      id: idIni + i,
      artist: m.artist || 'Desconhecido',
      title: m.title || 'Sem título',
      genero: m.genero || gen,
      src: m.newName
    };
  });

  jsonAtual = jsonMinificado
    ? JSON.stringify(arr)
    : '[\n' + arr.map(function(o){ return JSON.stringify(o); }).join(',\n') + '\n]';

  txt.value = jsonAtual;
  badge.textContent = arr.length;

  var corr = 0;
  for(var i = 0; i < musicas.length; i++) if(musicas[i].corrompido) corr++;
  if(corr > 0){
    info.textContent = '⚠️ ' + corr + ' corrompida(s)';
    info.style.color = '#f59e0b';
  } else {
    info.textContent = '✅ Pronto';
    info.style.color = '#34b87a';
  }
  tam.textContent = jsonAtual.length.toLocaleString('pt-BR') + ' chars';
}
function atualizarJson(){ _atualizarJsonReal(); }
var atualizarJsonDebounced = debounce(_atualizarJsonReal, 300);

function reanalisar(){
  if(musicas.length === 0){ toast('Nenhuma música.', 'w'); return; }
  toast('Re-analisando...', 'i');
  var pendentes = musicas.length;
  musicas.forEach(function(m){
    var respondeu = false;
    function finalizar(){
      if(respondeu) return;
      respondeu = true;
      pendentes--;
      if(pendentes === 0){ render(); toast('🔄 Re-análise concluída', 's'); }
    }
    var timeout = setTimeout(finalizar, 30000);
    try{
      var p = parseNome(m.originalName);
      lerTags(m.file, function(tags){
        clearTimeout(timeout);
        try{
          var tagArtist = (tags && tags.artist) ? limpar(tags.artist) : '';
          var tagTitle  = (tags && tags.title)  ? limpar(tags.title)  : '';
          var artist, title;
          var pNorm = norm(p.a);
          if(brain.artistas[pNorm]) artist = brain.artistas[pNorm];
          else if(tagArtist && !tagPareceCanal(tagArtist) && !ehLixo(tagArtist)) artist = tagArtist;
          else artist = p.a;
          artist = normalizarComAlias(artist);
          var tNorm = norm(p.t);
          if(brain.titulos[tNorm]) title = brain.titulos[tNorm];
          else if(tagTitle && !ehLixo(tagTitle) && !tagPareceCanal(tagTitle)) title = tagTitle;
          else title = p.t;
          title = removerArtistaDoTitulo(title, artist);
          m.artist = artist || '';
          m.title = title || '';
          m.genero = (tags && tags.genre) ? tags.genre : m.genero;
          m.corrompido = ehLixo(m.artist) || ehLixo(m.title) || norm(m.artist) === norm(m.title);
          m.newName = gerarNome(m, comExt(m.originalName));
        }catch(e){}
        finalizar();
      });
    }catch(e){ clearTimeout(timeout); finalizar(); }
  });
}

function adicionarArtistaConhecido(){
  var inp = $('artNovo');
  var val = inp.value.trim();
  if(!val){ toast('Digite um nome.', 'w'); return; }
  var itens = val.split(/[,;]/).map(function(s){ return s.trim(); }).filter(Boolean);
  var novos = 0, duplicados = 0;
  var adicionados = [];
  var suspeitos = [];

  for(var i = 0; i < itens.length; i++){
    var item = itens[i];
    var k = norm(item);
    if(!k || k.length < 2) continue;
    if(artistasConhecidos[k]){ duplicados++; continue; }
    var similares = Object.keys(artistasConhecidos).filter(function(exist){
      return exist !== k && (exist.indexOf(k) !== -1 || k.indexOf(exist) !== -1) &&
        Math.abs(exist.length - k.length) <= 3;
    });
    if(similares.length > 0) suspeitos.push({ item: item, k: k, existente: artistasConhecidos[similares[0]] });
    else { artistasConhecidos[k] = item; novos++; adicionados.push(item); }
  }

  var continuar = Promise.resolve();
  if(suspeitos.length > 0){
    var lista = suspeitos.map(function(s){ return '"' + s.item + '" ≈ "' + s.existente + '"'; }).join('\n');
    continuar = modalConfirm(lista + '\n\nAdicionar todos mesmo assim?').then(function(ok){
      if(ok){
        suspeitos.forEach(function(s){
          artistasConhecidos[s.k] = s.item;
          novos++; adicionados.push(s.item);
        });
      }
    });
  }

  return continuar.then(function(){
    if(novos === 0){ toast(duplicados > 0 ? 'Já estava na lista.' : 'Nada válido.', 'w'); return; }
    _cacheHashArt = '';
    _dirtyArtistas = true;
    if(!salvarArtistas()){ toast('❌ Não foi possível salvar!', 'e'); return; }
    adicionados.forEach(function(a){ var kk = norm(a); if(!brain.artistas[kk]) brain.artistas[kk] = a; });
    salvarBrain();
    inp.value = '';
    renderArtistas();
    toast('🎨 ' + novos + ' artista(s) salvo(s)!', 'save');
  });
}

   24. ZIP
   ============================================================ */
function baixarZip(){
  if(musicas.length === 0){ toast('Nenhuma música.', 'w'); return; }
  if(typeof JSZip === 'undefined'){ toast('JSZip não carregou.', 'e'); return; }
  toast('Preparando ZIP...', 'i');
  $('prog').classList.add('on');
  var zip = new JSZip();
  var total = musicas.length;
  var i = 0;
  var usados = {};

  function proximo(){
    if(i >= total){
      zip.generateAsync({ type:'blob' }, function(meta){
        $('progFill').style.width = Math.min(99, meta.percent).toFixed(0) + '%';
      }).then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'musicas_corrigidas.zip';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        $('prog').classList.remove('on');
        $('progFill').style.width = '0%';
        toast('✅ ZIP gerado: ' + total + ' música(s)', 's');
      });
      return;
    }
    var m = musicas[i];
    $('progFill').style.width = ((i+1)/total*90).toFixed(0) + '%';

    var chave = m.newName;
    usados[chave] = (usados[chave] || 0) + 1;
    var nomeFinal = usados[chave] === 1
      ? chave
      : chave.replace(/(\.[^.]+)$/, '_' + usados[chave] + '$1');

    if(!m.file){
      zip.file(nomeFinal, 'arquivo de exemplo — ' + m.title);
      i++; proximo(); return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      var buf = e.target.result;
      if(comExt(m.originalName).toLowerCase() === '.mp3'){
        try{ buf = escreverTags(buf, { artist:m.artist, title:m.title, genre:m.genero }); }catch(err){}
      }
      zip.file(nomeFinal, buf);
      i++; proximo();
    };
    reader.onerror = function(){ i++; proximo(); };
    reader.readAsArrayBuffer(m.file);
  }
  proximo();
}

   ============================================================ */
function demo(){
  var exemplos = [
    'Meu Amor Voltou Querem Nos Separar 5 da Manha - Ze Cantor.mp3',
    'Ze Cantor - Meu Amor Voltou Querem Nos Separar 5 da Manha.mp3',
    'Boa Sorte Pra Voce Na Pressao do Paredao - Brasas do Forro.mp3',
    'Moça - Wando.m4a',
    'Alceu Valença - Girassol.opus',
    'LUDMILLA e Alcione - Faz uma Loucura por mim _ Você me vira a cabeça.mp3',
    'A_Loba_OPUS_48kbps-Alcione.opus',
    'Gusttavo Lima - VOCÊ AINDA MORA AQUI AI Studio.mp3',
    '-Gustavo Lima-amor bom.mp3',
    '-Wando-Moça.mp3',
    'amor bom-Gustavo Lima.mp3'
  ];
  musicas = exemplos.map(function(nome){
    var p = parseNome(nome);
    var m = {
      id: 'm_' + (++idc) + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      file: null,
      originalName: nome,
      artist: p.a,
      title: p.t,
      genero: 'Music',
      corrompido: ehLixo(p.a) || ehLixo(p.t) || norm(p.a) === norm(p.t)
    };
    m.newName = gerarNome(m, comExt(nome));
    return m;
  });
  mapMusicas.clear();
  musicas.forEach(function(m){ mapMusicas.set(m.id, m); });
  render();
  toast('🎯 Exemplo carregado!', 's');
}

/* ============================================================
   27. INIT
   ============================================================ */
function init(){
  carregarBrain();
  carregarAliases();
  atualizarBrainStats();
  renderAbrev();
  renderArtistas();
  renderAliases();

  var zona = $('zona');
  var inp = $('inp');
  zona.addEventListener('click', function(e){ if(e.target !== inp) inp.click(); });
  zona.addEventListener('dragover', function(e){ e.preventDefault(); zona.classList.add('drag'); });
  zona.addEventListener('dragleave', function(e){ e.preventDefault(); zona.classList.remove('drag'); });
  zona.addEventListener('drop', function(e){
    e.preventDefault(); zona.classList.remove('drag');
    if(e.dataTransfer && e.dataTransfer.files.length) addArquivos(e.dataTransfer.files);
  });
  inp.addEventListener('change', function(e){
    if(e.target.files && e.target.files.length) addArquivos(e.target.files);
    inp.value = '';
  });
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){ e.preventDefault(); });

  document.querySelectorAll('[data-toggle]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var box = $(btn.dataset.toggle);
      if(!box) return;
      box.classList.toggle('on');
      btn.textContent = box.classList.contains('on') ? '🙈' : '👁️';
    });
  });

  $('btnAddLixo').addEventListener('click', function(){ adicionarLixoManual(false); });
  $('btnAddLixoAplicar').addEventListener('click', function(){ adicionarLixoManual(true); });
  $('lixoManual').addEventListener('keydown', function(e){ if(e.key === 'Enter') adicionarLixoManual(false); });

  $('btnAddAbrev').addEventListener('click', adicionarAbrev);
  $('btnResetAbrev').addEventListener('click', resetarAbrev);
  $('abrevPara').addEventListener('keydown', function(e){ if(e.key === 'Enter') adicionarAbrev(); });

  $('btnAddArt').addEventListener('click', adicionarArtistaConhecido);
  $('btnAddArtAtual').addEventListener('click', adicionarArtistasDasMusicas);
  $('btnResetArt').addEventListener('click', resetarArtistas);
  $('btnZerarArt').addEventListener('click', zerarArtistas);
  $('btnExportArt').addEventListener('click', exportarArtistas);
  $('btnImportArt').addEventListener('click', importarArtistas);
  $('btnAddMassa').addEventListener('click', adicionarMassa);
  $('btnLimparMassa').addEventListener('click', function(){ $('artMassa').value = ''; });
  $('artNovo').addEventListener('keydown', function(e){ if(e.key === 'Enter') adicionarArtistaConhecido(); });
  $('artBusca').addEventListener('input', function(e){
    artBuscaAtual = e.target.value;
    renderArtistas();
  });
  $('btnLimparBusca').addEventListener('click', function(){
    $('artBusca').value = '';
    artBuscaAtual = '';
    renderArtistas();
  });
  $('btnAddAlias').addEventListener('click', adicionarAlias);
  $('aliasPara').addEventListener('keydown', function(e){ if(e.key === 'Enter') adicionarAlias(); });
  $('inpImportArt').addEventListener('change', function(e){
    var f = e.target.files[0];
    if(f) processarImportArt(f);
    e.target.value = '';
  });

  document.addEventListener('click', function(e){
    var btn = e.target.closest('.chip button');
    if(!btn) return;
    if(btn.dataset.tab !== undefined){
      var k = btn.dataset.k;
      delete brain[btn.dataset.tab][k];
      if(btn.dataset.tab === 'lixo') _cacheHashLixo = '';
      salvarBrain();
      renderBrain();
      toast('Removido', 'i');
    } else if(btn.closest('#artLista')){
      var k2 = btn.dataset.k;
      var nome = artistasConhecidos[k2];
      delete artistasConhecidos[k2];
      _cacheHashArt = '';
      _dirtyArtistas = true;
      if(salvarArtistas()){ renderArtistas(); toast('🗑️ Removido: ' + nome, 'i'); }
    } else if(btn.closest('#aliasLista')){
      delete aliases[btn.dataset.k];
      salvarAliases();
      renderAliases();
      toast('Alias removido', 'i');
    } else if(btn.closest('#abrevLista')){
      delete abrev[btn.dataset.k];
      salvarAbrev();
      toast('Removido: ' + btn.dataset.k, 'i');
      if(musicas.length > 0){
        musicas.forEach(function(m){ m.newName = gerarNome(m, comExt(m.originalName)); });
        render();
      }
    }
  });

  $('corpo').addEventListener('input', onInputEdit);
  $('corpo').addEventListener('blur', onInputBlur, true);

  $('btnLimpar').addEventListener('click', limparTodos);
  $('btnReanalisar').addEventListener('click', reanalisar);
  $('btnReset').addEventListener('click', resetarCampos);
  $('btnClear').addEventListener('click', limparTudo);
  $('btnDemo').addEventListener('click', demo);
  $('btnZip').addEventListener('click', baixarZip);
  $('btnJson').addEventListener('click', baixarJson);
  $('btnGenero').addEventListener('click', aplicarGenero);
  $('btnCopyJson2').addEventListener('click', copiarJson);
  $('btnDownloadJson2').addEventListener('click', baixarJson);
  $('btnMinificar').addEventListener('click', toggleMinificar);

  $('btnToggleJson').addEventListener('click', function(){
    var p = $('jsonPainel');
    p.classList.toggle('on');
    $('btnToggleJson').textContent = p.classList.contains('on') ? '📋 Fechar' : '📋 JSON';
    if(p.classList.contains('on')) p.scrollIntoView({ behavior:'smooth' });
  });

  $('btnBrain').addEventListener('click', function(){
    var p = $('brainPainel');
    p.classList.toggle('on');
    if(p.classList.contains('on')){ renderBrain(); p.scrollIntoView({ behavior:'smooth' }); }
  });

  document.querySelectorAll('.brain-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.brain-tab').forEach(function(t){ t.classList.remove('on'); });
      tab.classList.add('on');
      brainTabAtual = tab.dataset.tab;
      renderBrain();
    });
  });

  $('btnExportBrain').addEventListener('click', exportarBrain);
  $('btnImportBrain').addEventListener('click', importarBrain);
  $('btnResetBrain').addEventListener('click', resetarBrain);

  $('inpBrain').addEventListener('change', function(e){
    var f = e.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(ev){
      try{
        var obj = JSON.parse(ev.target.result);
        if(obj.brain){
          brain.lixo = obj.brain.lixo || {};
          brain.artistas = obj.brain.artistas || {};
          brain.titulos = obj.brain.titulos || {};
        }
        if(obj.abrev) abrev = obj.abrev;
        if(obj.aliases) aliases = obj.aliases;
        if(obj.artistas && Array.isArray(obj.artistas)){
          artistasConhecidos = {};
          obj.artistas.forEach(function(a){ artistasConhecidos[norm(a)] = a; });
        }
        _cacheHashLixo = '';
        _cacheHashArt = '';
        _dirtyArtistas = true;
        salvarBrain();
        salvarAbrev();
        salvarAliases();
        salvarArtistas();
        renderBrain();
        renderAliases();
        renderArtistas();
        toast('🧠 Cérebro importado!', 'save');
      }catch(err){ toast('Arquivo inválido.', 'e'); }
    };
    r.readAsText(f);
    e.target.value = '';
  });

  $('idInicial').addEventListener('input', atualizarJsonDebounced);
  $('generoGeral').addEventListener('input', atualizarJsonDebounced);

  window.addEventListener('beforeunload', function(){
    try{
      if(Object.keys(artistasConhecidos).length > 0){ _dirtyArtistas = true; salvarArtistas(); }
      if(Object.keys(aliases).length > 0) salvarAliases();
      _salvarBrainReal();
    }catch(e){}
  });

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){
      try{
        _dirtyArtistas = true;
        salvarArtistas(); salvarAliases(); _salvarBrainReal();
      }catch(e){}
    }
  });

  setInterval(function(){
    try{ if(_dirtyArtistas && Object.keys(artistasConhecidos).length > 0) salvarArtistas(); }catch(e){}
  }, 60000);

  setTimeout(function(){
    var ok1 = typeof JSZip !== 'undefined';
    var ok2 = typeof ID3Writer !== 'undefined';
    if(!ok1) toast('⚠️ JSZip não carregou', 'w');
    if(!ok2) toast('⚠️ ID3Writer não carregou', 'w');
  }, 500);

  console.log('🎵 Editor v11 iniciado | ' + Object.keys(artistasConhecidos).length + ' artistas');
  toast('💾 Salvamento blindado ativo!', 'save');
}

init();
})();
</script>
