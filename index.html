const getRegexLixo = () => {
  const todas = LIXO_BASE.concat(Object.keys(brain.lixo));
  const hash = todas.slice().sort().join('|');
  if(_cacheRegexLixo && _cacheHashLixo === hash) return _cacheRegexLixo;

  const LOTE = 50;
  const regexes = [];
  const vistos = new Set();
  const unicas = todas.filter(p => {
    const k = norm(p);
    if(!k || vistos.has(k)) return false;
    vistos.add(k); return true;
  }).sort((a,b) => b.length - a.length);

  for(let i = 0; i < unicas.length; i += LOTE){
    const lote = unicas.slice(i, i + LOTE);
    const padrao = lote.map(p => escapeRegex(p)).join('|');
    regexes.push(new RegExp(`(^|[\\s\\-_\\/|,;:.!?()\\[\\]])(${padrao})([\\s\\-_\\/|,;:.!?()\\[\\]]|$)`, 'gi'));
  }

  _cacheRegexLixo = regexes;
  _cacheHashLixo = hash;
  return regexes;
};

const removerNumeros = s => {
  if(!s) return '';
  return String(s).replace(/\b\d+\b/g,' ').replace(/\d+/g,' ').replace(/\s+/g,' ').trim();
};

const removerSimbolos = s => {
  s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/gu,' ');
  s = s.replace(/[♪♫♬♭♮♯🎤🎶🎵🎧🎼]/g,' ');
  s = s.replace(/[\u00A0\u200B\u200C\u200D\uFEFF\u200E\u200F\u2028\u2029]/g,' ');
  return s;
};

const limparPalavras = s => {
  if(!s) return '';
  const regexes = getRegexLixo();
  for(let i = 0; i < regexes.length; i++){
    s = s.replace(regexes[i], ' ');
  }
  s = s.replace(/\b\d+\s*kbps\b/gi,' ');
  return s;
};

const limpar = txt => {
  if(!txt) return '';
  let s = String(txt).replace(/_/g,' ');
  s = removerSimbolos(s);
  s = s.replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ');
  s = limparPalavras(s);
  s = removerNumeros(s);
  s = s.replace(/[!?'"`´~^*#@$%&=+,;:]+/g,' ');
  s = s.replace(/\s*[-–—]\s*$/,' ').replace(/^\s*[-–—]\s*/,' ');
  s = s.replace(/\s+/g,' ').replace(/^[\s\-–—_,;:.]+/,'').replace(/[\s\-–—_,;:]+$/,'');
  return s.trim();
};

const ehLixo = t => {
  if(!t) return true;
  const x = norm(t);
  if(!x) return true;
  if(/^\d+[\s._-]*kbps/.test(x)) return true;
  if(/^[\d\s.\-_]+$/.test(x)) return true;
  return false;
};

const tagPareceCanal = txt => {
  if(!txt) return false;
  return /\b(sem filtro|oficial|canal|records|studio|estúdio|estudio|tv|web|play|top|best|hits|coletânea|coletanea|various|compilation|playlist|prod)\b/i.test(txt);

// ============================================================

const abreviarPalavra = p => {
  if(!p) return p;
  const chave = norm(p);
  if(abrev[chave]) return abrev[chave];
  if(p.length <= 4) return p;  // não abrevia palavras curtas (corrige "Amor" → "A.")
  if(p.length <= 6){
    const semVogais = p.charAt(0) + p.slice(1, -1).replace(/[aeiouáéíóúâêôãõà]/gi,'') + p.slice(-1);
    if(semVogais.length >= 3 && semVogais.length < p.length) return semVogais;
    return p;
  }
  return p.slice(0, 5) + '.';
};

const abreviarTexto = (txt, limite) => {
  if(!txt) return '';
  if(txt.length <= limite) return txt;
  let palavras = txt.split(/\s+/);
  let abreviado = palavras.map(p => {
    const m = p.match(/^([\/\-–—(]?)([A-Za-zÀ-Ýà-ÿ]+)([\/\-–—),.]?)$/);
    if(!m) return p;
    return m[1] + abreviarPalavra(m[2]) + m[3];
  }).join(' ');
  if(abreviado.length <= limite) return abreviado;
  const palavras2 = abreviado.split(/\s+/);
  while(palavras2.length > 2 && palavras2.join(' ').length > limite) palavras2.pop();
  abreviado = palavras2.join(' ');
  if(abreviado.length > limite){
    const corte = abreviado.slice(0, limite);
    const ultimoEspaco = corte.lastIndexOf(' ');
    abreviado = ultimoEspaco > limite * 0.5 ? corte.slice(0, ultimoEspaco) : corte;
  }
  return abreviado.trim();
};

const capitalizar = s => {
  if(!s) return '';
  return s.split(/\s+/).map(p => {
    if(p.length <= 2 && /^(de|da|do|das|dos|e|o|a|os|as|em|no|na)$/i.test(p)) return p.toLowerCase();
    return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
  }).join(' ');
};

    });
  }
  _cacheRegexArt = regexes;
  _cacheHashArt = hash;
  return regexes;
};

const encontrarArtistaEm = txt => {
  if(!txt) return null;
  const n = norm(txt);
  const regexes = getRegexArtistas();
  for(const { re } of regexes){
    const m = n.match(re);
    if(m){
      const match = m[2];
      const chave = Object.keys(artistasConhecidos).find(k => norm(artistasConhecidos[k]) === match);
      if(chave) return artistasConhecidos[chave];
    }
  }
  const chavesAlias = Object.keys(aliases).sort((a,b) => b.length - a.length);
  for(let i = 0; i < chavesAlias.length; i += 50){
    const lote = chavesAlias.slice(i, i + 50);
    const padrao = lote.map(k => escapeRegex(k)).join('|');
    const re = new RegExp(`(^|[\\s\\-_\\/|,;:.!?()\\[\\]])(${padrao})([\\s\\-_\\/|,;:.!?()\\[\\]]|$)`, 'i');
    const m = n.match(re);
    if(m){
      const match = m[2];
      const chave = chavesAlias.find(k => k === match);
      if(chave) return aliases[chave];
    }
  }
  return null;
};

// ============================================================
// PARSER  (regras do "-" na frente e "Titulo-Artista")
// ============================================================
const removerArtistaDoTitulo = (title, artist) => {
  if(!title || !artist) return title;
  const re = new RegExp('^' + escapeRegex(artist) + '\\s*[-–—:/|]\\s*','i');
  const out = title.replace(re,'').trim();
  return out.length < 3 ? title : out;
};

// Detecta "-Artista-Titulo" no nome original (traço na frente força artista)
const parseTracoFrente = nomeBase => {
  const m = String(nomeBase).match(/^\s*[-–—]\s*(.+?)\s*[-–—]\s*(.+)$/);
  if(!m) return null;
  return { artista: m[1].trim(), titulo: m[2].trim() };
};

const parseNome = nome => {
  const base = String(nome).replace(/\.[^.]+$/,'');

  // 1) Regra do traço na frente: -Artista-Titulo
  const forca = parseTracoFrente(base);
  if(forca){
    let a = limpar(forca.artista);
    let t = limpar(forca.titulo);
    if(a){
      a = normalizarComAlias(a);
      const aNorm = norm(a);
      if(brain.artistas[aNorm]) a = brain.artistas[aNorm];
    }
    if(t){
      const tNorm = norm(t);
      if(brain.titulos[tNorm]) t = brain.titulos[tNorm];
    }
    if(!t) t = a;
    t = removerArtistaDoTitulo(t, a);
    return { a: capitalizar(a), t: capitalizar(t) };
  }

  // 2) Parser normal
  let s = base.replace(/_/g,' ').replace(/\s+/g,' ').trim();
  s = s.replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ');
  s = s.replace(/\s+/g,' ').trim();
  s = limparPalavras(s);
  s = removerNumeros(s);
  s = s.replace(/\b\d+\s*kbps\b/gi,' ');
  s = s.replace(/\s+/g,' ').trim();

  // Separa feat/part/com do núcleo
  const featMatch = s.match(FEAT_RE);
  let featTrecho = '';
  if(featMatch){
    featTrecho = s.slice(featMatch.index).trim();
    s = s.slice(0, featMatch.index).trim();
  }

  const artistaConhecido = encontrarArtistaEm(s);
  let artistaDetectado = '';
  let tituloDetectado = '';

  let partes = s.split(/\s*[+\-–—]\s*/).filter(p => p.trim().length > 0);
  partes = partes.map(p => limpar(p)).filter(p => p && !ehLixo(p));

  if(artistaConhecido){
    artistaDetectado = artistaConhecido;
    const restoTitulo = partes.filter(p => {
      const pn = norm(p), an = norm(artistaConhecido);
      return pn !== an && pn.indexOf(an) === -1 && an.indexOf(pn) === -1;
    }).join(' ');
    tituloDetectado = restoTitulo ? limpar(restoTitulo) : limpar(s);
  } else if(partes.length >= 2){
    // Heurística: "Titulo-Artista" ou "Artista-Titulo"
    const p1 = partes[0], p2 = partes[1];
    const w1 = p1.split(/\s+/).length, w2 = p2.split(/\s+/).length;

    // Se o 2º bloco tem 1-2 palavras e o 1º tem >=3, provavelmente é "Titulo-Artista"
    if(w2 <= 2 && w1 >= 3){ artistaDetectado = p2; tituloDetectado = p1; }
    else if(w1 <= 2 && w2 >= 3){ artistaDetectado = p1; tituloDetectado = p2; }
    else if(w1 <= 2 && w2 <= 2){ artistaDetectado = p1; tituloDetectado = partes.slice(1).join(' '); }
    else { artistaDetectado = p1; tituloDetectado = partes.slice(1).join(' '); }
  } else if(partes.length === 1){
    const m = s.match(/^(.+?)\s+[-–—]\s+(.+)$/);
    if(m){ artistaDetectado = limpar(m[1]); tituloDetectado = limpar(m[2]); }
    else { tituloDetectado = partes[0]; }
  }

  if(featTrecho){
    tituloDetectado = (tituloDetectado ? tituloDetectado + ' ' : '') + limpar(featTrecho);
  }

  if(artistaDetectado){
    artistaDetectado = normalizarComAlias(artistaDetectado);
    const aNorm = norm(artistaDetectado);
    if(brain.artistas[aNorm]) artistaDetectado = brain.artistas[aNorm];
  }
  if(tituloDetectado){
    const tNorm = norm(tituloDetectado);
    if(brain.titulos[tNorm]) tituloDetectado = brain.titulos[tNorm];
  }
  if(!tituloDetectado) tituloDetectado = limpar(s);

  // Corrige fallback circular: se artista === título, deixa artista vazio
  if(artistaDetectado && tituloDetectado && norm(artistaDetectado) === norm(tituloDetectado)){
    artistaDetectado = '';
  }

  tituloDetectado = removerArtistaDoTitulo(tituloDetectado, artistaDetectado);
  return { a: capitalizar(artistaDetectado), t: capitalizar(tituloDetectado) };
};

// ============================================================
// TAGS — MP3 (ID3v2) e OPUS/OGG (Vorbis comment) binários
// ============================================================
const lerTags = (file, cb) => {
  if(!file){ cb(null); return; }
  const ext = comExt(file.name).toLowerCase();
  if(ext !== '.mp3' && ext !== '.opus' && ext !== '.ogg'){ cb(null); return; }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const buf = e.target.result;
      const v = new DataView(buf);
      const tags = { artist:'', title:'', genre:'' };

      // ---- MP3 ID3v2 ----
      if(ext === '.mp3' && v.byteLength >= 10 &&
         v.getUint8(0)===0x49 && v.getUint8(1)===0x44 && v.getUint8(2)===0x33){
        const tagSize = ((v.getUint8(6)&0x7F)<<21)|((v.getUint8(7)&0x7F)<<14)|((v.getUint8(8)&0x7F)<<7)|(v.getUint8(9)&0x7F);
        const total = Math.min(10 + tagSize, v.byteLength);
        const dec = new TextDecoder('utf-8');
        let off = 10;
        while(off < total - 10){
          try{
            const fid = String.fromCharCode(v.getUint8(off),v.getUint8(off+1),v.getUint8(off+2),v.getUint8(off+3));
            const fsz = (v.getUint8(off+4)<<24)|(v.getUint8(off+5)<<16)|(v.getUint8(off+6)<<8)|v.getUint8(off+7);
            if(fsz <= 0 || fsz > 500000 || off+10+fsz > total) break;
            if(fid==='TIT2' || fid==='TPE1' || fid==='TCON'){
              const enc = v.getUint8(off+10);
              const bytes = new Uint8Array(buf, off+11, fsz-1);
              let txt = '';
              if(enc===0 || enc===3){ txt = dec.decode(bytes); }
              else {
                const c = [];
                for(let k=0;k+1<bytes.length;k+=2) c.push(String.fromCharCode(bytes[k]|(bytes[k+1]<<8)));
                txt = c.join('');
              }
              txt = txt.replace(/\0/g,'').replace(/^\uFEFF/,'').trim();
              if(fid==='TIT2') tags.title = txt;
              if(fid==='TPE1') tags.artist = txt;
              if(fid==='TCON') tags.genre = txt;
            }
            off += 10 + fsz;
          }catch(err){ break; }
        }
      }

      // ---- OPUS/OGG Vorbis comment (binário, sem decodificar o arquivo todo) ----
      if((ext === '.opus' || ext === '.ogg') && v.byteLength > 16){
        const bytes = new Uint8Array(buf);
        const magic = [0x4F,0x70,0x75,0x73,0x54,0x61,0x67,0x73]; // "OpusTags"
        const magicVorbis = [0x03,0x76,0x6F,0x72,0x62,0x69,0x73];  // "\x03vorbis"
        let idx = -1;
        for(let i = 0; i + 8 <= bytes.length; i++){
          if(bytes[i]===magic[0] && bytes[i+1]===magic[1] && bytes[i+2]===magic[2] && bytes[i+3]===magic[3] &&
             bytes[i+4]===magic[4] && bytes[i+5]===magic[5] && bytes[i+6]===magic[6] && bytes[i+7]===magic[7]){
            idx = i + 8; break;
          }
          if(bytes[i]===magicVorbis[0] && bytes[i+1]===magicVorbis[1] && bytes[i+2]===magicVorbis[2] &&
             bytes[i+3]===magicVorbis[3] && bytes[i+4]===magicVorbis[4] && bytes[i+5]===magicVorbis[5]){
            idx = i + 7; break;
          }
        }
        if(idx >= 0 && idx + 4 <= bytes.length){
          const dv = new DataView(buf);
          const vendorLen = dv.getUint32(idx, true); idx += 4;
          if(idx + vendorLen + 4 <= bytes.length){
            idx += vendorLen;
            const commentCount = dv.getUint32(idx, true); idx += 4;
            const dec = new TextDecoder('utf-8');
            for(let c = 0; c < commentCount && idx + 4 <= bytes.length; c++){
              const len = dv.getUint32(idx, true); idx += 4;
              if(idx + len > bytes.length) break;
              const txt = dec.decode(bytes.subarray(idx, idx + len));
              idx += len;
              const eq = txt.indexOf('=');
              if(eq <= 0) continue;
              const key = txt.slice(0, eq).toUpperCase();
              const val = txt.slice(eq + 1).trim();
              if(!val) continue;
              if(key === 'TITLE') tags.title = val;
              if(key === 'ARTIST') tags.artist = val;
              if(key === 'GENRE') tags.genre = val;
            }
          }
        }
      }

      cb(tags);
    }catch(err){ cb(null); }
  };
  reader.onerror = () => cb(null);
  // Lê até 2MB (ID3v2 pode ter APIC grande), não corta em 500KB
  reader.readAsArrayBuffer(file.slice(0, 2 * 1024 * 1024));
};

// Preserva frames antigos antes de sobrescrever (capa, álbum, faixa)
const escreverTags = (buffer, tags) => {
  if(typeof ID3Writer === 'undefined') return buffer;
  try{
    const w = new ID3Writer(buffer);
    // Captura frames antigos que queremos preservar
    const preservar = {};
    try{
      const old = w.parseTag ? w.parseTag() : null;
      if(old && old.frames){
        ['APIC','TALB','TRCK','TYER','TPOS','TCOM','TPE2'].forEach(fid => {
          const f = old.frames.find(x => x.id === fid);
          if(f) preservar[fid] = f;
        });
      }
    }catch(e){}

    // Remove a tag antiga e reescreve
    try{ w.removeTag(); }catch(e){}

    if(tags.title)  w.setFrame('TIT2', tags.title);
    if(tags.artist) w.setFrame('TPE1', tags.artist);
    if(tags.genre)  w.setFrame('TCON', tags.genre);

    Object.keys(preservar).forEach(fid => {
      try{
        const f = preservar[fid];
        if(fid === 'APIC' && f.picture){
          w.setFrame('APIC', { type: f.picture.type || 3, data: f.picture.data, description: f.picture.description || '' });
        } else if(fid !== 'APIC' && f.value != null){
          w.setFrame(fid, f.value);
        }
      }catch(e){}
    });

    return w.addTag();
  }catch(err){
    console.error('Erro ID3:', err);
    return buffer;
  }
};

// ============================================================
// SANITIZE / GERAR NOME (Artista_Titulo.ext)
// ============================================================
const sanitize = s => {
  if(!s) return '';
  let x = String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  x = x.replace(/[^A-Za-z0-9\s\-_]/g,'');      // permite _ e -
  x = x.replace(/\s+/g,'_').replace(/_+/g,'_');
  x = x.replace(/-+/g,'-');
  x = x.replace(/^[_\-.]+|[_\-.]+$/g,'');      // remove pontas
  return x;
};

const gerarNome = (m, ext) => {
  const art = sanitize(m.artist) || 'desconhecido';
  const tit = sanitize(m.title) || 'sem_titulo';
  let limiteSemExt = LIMITE_NOME - ext.length;
  if(limiteSemExt < 15) limiteSemExt = 15;

  // Se artista e título iguais, entrega só um
  if(norm(art) === norm(tit)){
    let so = tit;
    if(so.length > limiteSemExt) so = sanitize(abreviarTexto(m.title, limiteSemExt));
    return so + ext;
  }

  // Ordem: Artista_Titulo
  let nomeCompleto = art + '_' + tit;
  if(nomeCompleto.length <= limiteSemExt) return nomeCompleto + ext;

  // Corta título primeiro
  let espacoTit = limiteSemExt - art.length - 1;
  if(espacoTit < 10) espacoTit = Math.floor(limiteSemExt * 0.45);
  let tAbrev = sanitize(abreviarTexto(m.title, espacoTit));
  if(!tAbrev) tAbrev = tit.slice(0, espacoTit);

  nomeCompleto = art + '_' + tAbrev;
  if(nomeCompleto.length > limiteSemExt){
    let espacoArt = limiteSemExt - tAbrev.length - 1;
    if(espacoArt < 5) espacoArt = 5;
    let aAbrev = sanitize(abreviarTexto(m.artist, espacoArt));
    if(!aAbrev) aAbrev = art.slice(0, espacoArt);
    nomeCompleto = aAbrev + '_' + tAbrev;
  }
  if(nomeCompleto.length > limiteSemExt){
    nomeCompleto = nomeCompleto.slice(0, limiteSemExt).replace(/[_\-.]+$/,'');
  }
  return nomeCompleto + ext;
};

// ============================================================
// APRENDIZADO
// ============================================================
const aprenderLixo = (textoOriginal, textoLimpo) => {
  if(!textoOriginal) return;
  const orig = String(textoOriginal).trim();
  const limpoNorm = norm(textoLimpo || '');
  const palavras = orig.split(/\s+/).filter(Boolean);
  const aprendidos = [];
  palavras.forEach(p => {
    const pn = norm(p).replace(/[^\w\s]/g,'').trim();
    if(!pn || pn.length < 3) return;
    if(limpoNorm.indexOf(pn) === -1){
      if(!brain.lixo[pn] && !ehLixo(pn) && pn.length <= 30){
        brain.lixo[pn] = true;
        aprendidos.push(p);
      }
    }
  });
  if(aprendidos.length){
    _cacheHashLixo = '';
    salvarBrain();
    toast('🧠 Aprendi: ' + aprendidos.slice(0,3).join(', ') + (aprendidos.length > 3 ? '...' : ''), 'b');
  }
};

const aprenderArtista = nome => {
  if(!nome) return;
  const n = String(nome).trim();
  if(n.length < 2) return;
  const chave = norm(n);
  if(brain.artistas[chave] !== n){ brain.artistas[chave] = n; salvarBrain(); }
  if(!artistasConhecidos[chave]){
    artistasConhecidos[chave] = n;
    _cacheHashArt = '';
    _dirtyArtistas = true;
    if(salvarArtistas()) toast('🎨 Artista salvo: ' + n, 'save');
  }
};

const aprenderTitulo = nome => {
  if(!nome) return;
  const n = String(nome).trim();
  if(n.length < 2) return;
  const chave = norm(n);
  if(brain.titulos[chave] !== n){
    brain.titulos[chave] = n;
    salvarBrain();
    toast('🧠 Título salvo: ' + n.substring(0,40), 'b');
  }
};

// ============================================================
// ADD ARQUIVOS  (sem timeout curto que perde arquivos)
// ============================================================
const addArquivos = fileList => {
  const arr = [];
  for(let i = 0; i < fileList.length; i++){
    if(/\.(mp3|opus|m4a|flac|ogg|wav)$/i.test(fileList[i].name)) arr.push(fileList[i]);
  }
  if(arr.length === 0){ toast('Nenhum arquivo suportado.', 'e'); return; }
  toast('Lendo ' + arr.length + ' arquivo(s)...', 'i');

  // Deduplica por nome+tamanho
  const vistos = new Set();
  const naoDup = arr.filter(f => {
    const k = f.name + '|' + f.size;
    if(vistos.has(k)) return false;
    vistos.add(k); return true;
  });
  if(naoDup.length < arr.length){
    toast('⚠️ ' + (arr.length - naoDup.length) + ' duplicado(s) ignorado(s)', 'w');
  }

  let pendentes = naoDup.length;
  if(pendentes === 0) return;

  const concluir = () => {
    pendentes--;
    if(pendentes === 0){
      render();
      toast('✅ ' + naoDup.length + ' arquivo(s) carregado(s)', 's');
    }
  };

  naoDup.forEach(file => {
    let respondeu = false;
    const finalizar = () => { if(!respondeu){ respondeu = true; concluir(); } };
    // Timeout de segurança longo (30s) — só evita travar em arquivo corrompido
    const timeout = setTimeout(finalizar, 30000);
    try{
      const p = parseNome(file.name);
      lerTags(file, tags => {
        clearTimeout(timeout);
        try{
          const tagArtist = (tags && tags.artist) ? limpar(tags.artist) : '';
          const tagTitle  = (tags && tags.title)  ? limpar(tags.title)  : '';
          const tagGenero = (tags && tags.genre) ? tags.genre : '';

          let artist, title;
          const pNorm = norm(p.a);
          if(brain.artistas[pNorm]) artist = brain.artistas[pNorm];
          else if(tagArtist && !tagPareceCanal(tagArtist) && !ehLixo(tagArtist)) artist = tagArtist;
          else artist = p.a;

          artist = normalizarComAlias(artist);

          const tNorm = norm(p.t);
          if(brain.titulos[tNorm]) title = brain.titulos[tNorm];
          else if(tagTitle && !ehLixo(tagTitle) && !tagPareceCanal(tagTitle)) title = tagTitle;
          else title = p.t;

          title = removerArtistaDoTitulo(title, artist);

          const m = {
            id: 'm_' + (++idc) + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
            file: file,
            originalName: file.name,
            artist: artist || '',
            title: title || '',
            genero: tagGenero || '',
            corrompido: ehLixo(artist) || ehLixo(title) || norm(artist) === norm(title)
          };
          m.newName = gerarNome(m, comExt(file.name));
          musicas.push(m);
          mapMusicas.set(m.id, m);
        }catch(e){ console.error('Erro processando arquivo:', e); }
        finalizar();
      });
    }catch(e){
      clearTimeout(timeout);
      finalizar();
    }
  });
};

  let html = '';

        <span class="num">${i+1}</span>

        <span class="st">${st}</span>
      </div>
      <div class="campos">
        <div class="campo">

          <input data-id="${m.id}" data-campo="artist" value="${escAttr(m.artist)}" placeholder="Artista">
        </div>
        <div class="campo">
          <label>Título</label>
          <input data-id="${m.id}" data-campo="title" value="${escAttr(m.title)}" placeholder="Título">
        </div>
        <div class="campo">
          <label>Gênero</label>
          <input data-id="${m.id}" data-campo="genero" value="${escAttr(m.genero)}" placeholder="Gênero">

const onInputEdit = e => {
  const inp = e.target;
  if(!inp.dataset || !inp.dataset.id) return;
  const m = mapMusicas.get(inp.dataset.id);
  if(!m) return;
  m[inp.dataset.campo] = inp.value;
  if(inp.dataset.campo === 'artist' || inp.dataset.campo === 'title'){
    m.corrompido = ehLixo(m.artist) || ehLixo(m.title) || norm(m.artist) === norm(m.title);
    m.newName = gerarNome(m, comExt(m.originalName));
    const card = inp.closest('.card-mus');
    if(card){
      card.classList.toggle('cor', m.corrompido);
      card.querySelector('.st').textContent = m.corrompido ? '⚠️' : '✅';
      const nn = card.querySelector('.novo-nome');
      if(nn){ nn.innerHTML = '<b>→</b> ' + esc(m.newName); nn.title = m.newName; }
    }
  }
  stats();
  atualizarJsonDebounced();
};

const onInputBlur = e => {
  const inp = e.target;
  if(!inp.dataset || !inp.dataset.id) return;
  const m = mapMusicas.get(inp.dataset.id);
  if(!m) return;
  const campo = inp.dataset.campo;
  const valor = inp.value.trim();
  if(!valor) return;
  if(campo === 'artist') aprenderArtista(valor);
  else if(campo === 'title') aprenderTitulo(valor);
};

// ============================================================
// JSON
// ============================================================
const _atualizarJsonReal = () => {
  const txt = $('jsonTexto');
  const badge = $('jsonBadge');
  const info = $('jsonInfo');
  const tam = $('jsonTamanho');
  if(!txt) return;

  // Não rouba foco de outro input (exceto o próprio textarea readonly)
  const ativo = document.activeElement;
  if(ativo && ativo !== txt && (ativo.tagName === 'INPUT' || ativo.tagName === 'TEXTAREA')) return;

  if(musicas.length === 0){

const reanalisar = () => {
  if(musicas.length === 0){ toast('Nenhuma música.', 'w'); return; }
  toast('Re-analisando...', 'i');
  let pendentes = musicas.length;
  musicas.forEach(m => {
    let respondeu = false;
    const finalizar = () => {
      if(respondeu) return;
      respondeu = true;
      pendentes--;
      if(pendentes === 0){ render(); toast('🔄 Re-análise concluída', 's'); }
    };
    const timeout = setTimeout(finalizar, 30000);
    try{
      const p = parseNome(m.originalName);
      lerTags(m.file, tags => {
        clearTimeout(timeout);
        try{
          const tagArtist = (tags && tags.artist) ? limpar(tags.artist) : '';
          const tagTitle  = (tags && tags.title)  ? limpar(tags.title)  : '';
          let artist, title;
          const pNorm = norm(p.a);
          if(brain.artistas[pNorm]) artist = brain.artistas[pNorm];
          else if(tagArtist && !tagPareceCanal(tagArtist) && !ehLixo(tagArtist)) artist = tagArtist;
          else artist = p.a;
          artist = normalizarComAlias(artist);
          const tNorm = norm(p.t);
          if(brain.titulos[tNorm]) title = brain.titulos[tNorm];
          else if(tagTitle && !ehLixo(tagTitle) && !tagPareceCanal(tagTitle)) title = tagTitle;
          else title = p.t;
          title = removerArtistaDoTitulo(title, artist);
          m.artist = artist || '';
          m.title = title || '';
          m.genero = (tags && tags.genre) ? tags.genre : m.genero;
          m.corrompido = ehLixo(m.artist) || ehLixo(m.title) || norm(m.artist) === norm(m.title);
          m.newName = gerarNome(m, comExt(m.originalName));
        }catch(e){}
        finalizar();
      });
    }catch(e){ clearTimeout(timeout); finalizar(); }
  });
};

const adicionarArtistaConhecido = async () => {
  const inp = $('artNovo');
  const val = inp.value.trim();
  if(!val){ toast('Digite um nome.', 'w'); return; }
  const itens = val.split(/[,;]/).map(s => s.trim()).filter(Boolean);
  let novos = 0, duplicados = 0;
  const adicionados = [];
  const suspeitos = [];

  for(const item of itens){
    const k = norm(item);
    if(!k || k.length < 2) continue;
    if(artistasConhecidos[k]){ duplicados++; continue; }
    const similares = Object.keys(artistasConhecidos).filter(exist =>
      exist !== k && (exist.indexOf(k) !== -1 || k.indexOf(exist) !== -1) &&
      Math.abs(exist.length - k.length) <= 3
    );
    if(similares.length > 0) suspeitos.push({ item, k, existente: artistasConhecidos[similares[0]] });
    else { artistasConhecidos[k] = item; novos++; adicionados.push(item); }
  }

  if(suspeitos.length > 0){
    const lista = suspeitos.map(s => `"${s.item}" ≈ "${s.existente}"`).join('\n');
    const ok = await modalConfirm(lista + '\n\nAdicionar todos mesmo assim?');
    if(ok){
      suspeitos.forEach(s => {
        artistasConhecidos[s.k] = s.item;
        novos++; adicionados.push(s.item);
      });
    }
  }

  if(novos === 0){ toast(duplicados > 0 ? 'Já estava na lista.' : 'Nada válido.', 'w'); return; }
  _cacheHashArt = '';
  _dirtyArtistas = true;
  if(!salvarArtistas()){ toast('❌ Não foi possível salvar!', 'e'); return; }
  adicionados.forEach(a => { const k = norm(a); if(!brain.artistas[k]) brain.artistas[k] = a; });
  salvarBrain();
  inp.value = '';
  renderArtistas();
  toast('🎨 ' + novos + ' artista(s) salvo(s)!', 'save');
};

const baixarZip = () => {
  if(musicas.length === 0){ toast('Nenhuma música.', 'w'); return; }
  if(typeof JSZip === 'undefined'){ toast('JSZip não carregou.', 'e'); return; }
  toast('Preparando ZIP...', 'i');
  $('prog').classList.add('on');
  const zip = new JSZip();
  const total = musicas.length;
  let i = 0;
  const usados = {};
  const proximo = () => {
    if(i >= total){
      zip.generateAsync({ type:'blob' }, meta => {
        $('progFill').style.width = Math.min(99, meta.percent).toFixed(0) + '%';
      }).then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'musicas_corrigidas.zip';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        $('prog').classList.remove('on');
        $('progFill').style.width = '0%';
        toast('✅ ZIP gerado: ' + total + ' música(s)', 's');
      });
      return;
    }
    const m = musicas[i];
    $('progFill').style.width = ((i+1)/total*90).toFixed(0) + '%';

    // Colisão correta (não sobrescreve com 3+ iguais)
    const chave = m.newName;
    usados[chave] = (usados[chave] || 0) + 1;
    const nomeFinal = usados[chave] === 1
      ? chave
      : chave.replace(/(\.[^.]+)$/, '_' + usados[chave] + '$1');

    if(!m.file){
      zip.file(nomeFinal, 'arquivo de exemplo — ' + m.title);
      i++; proximo(); return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      let buf = e.target.result;
      if(comExt(m.originalName).toLowerCase() === '.mp3'){
        try{ buf = escreverTags(buf, { artist:m.artist, title:m.title, genre:m.genero }); }catch(err){}
      }
      zip.file(nomeFinal, buf);
      i++; proximo();
    };
    reader.onerror = () => { i++; proximo(); };
    reader.readAsArrayBuffer(m.file);
  };
  proximo();
};

const toast = (msg, tipo) => {
  const wrap = $('toastWrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo || 'i');
  const ic = { s:'✅', e:'❌', w:'⚠️', i:'ℹ️', b:'🧠', save:'💾' };
  el.textContent = (ic[tipo] || 'ℹ️') + ' ' + msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'all .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-20px)';
    setTimeout(() => el.remove(), 300);
  }, 3500);
};

// ============================================================
// MODAL
// ============================================================
const modalConfirm = (msg, title) => {
  return new Promise(resolve => {
    const ov = $('modalOverlay');
    const tit = $('modalTitle');
    const m = $('modalMsg');
    const inp = $('modalInput');
    const ok = $('modalOk');
    const cancel = $('modalCancel');
    tit.textContent = title || 'Confirmação';
    m.textContent = msg;
    inp.style.display = 'none';
    ov.classList.add('on');
    const fechar = v => {
      ov.classList.remove('on');
      ok.onclick = null; cancel.onclick = null; ov.onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(v);
    };
    const onKey = e => { if(e.key === 'Escape') fechar(false); if(e.key === 'Enter') fechar(true); };
    document.addEventListener('keydown', onKey);
    ok.onclick = () => fechar(true);
    cancel.onclick = () => fechar(false);
    ov.onclick = e => { if(e.target === ov) fechar(false); };
  });
};

// INIT
// ============================================================
const init = () => {
  carregarBrain();
  carregarAliases();
  atualizarBrainStats();
  renderAbrev();
  renderArtistas();
  renderAliases();

  const zona = $('zona');
  const inp = $('inp');
  zona.addEventListener('click', e => { if(e.target !== inp) inp.click(); });
  zona.addEventListener('dragover', e => { e.preventDefault(); zona.classList.add('drag'); });
  zona.addEventListener('dragleave', e => { e.preventDefault(); zona.classList.remove('drag'); });
  zona.addEventListener('drop', e => {
    e.preventDefault(); zona.classList.remove('drag');
    if(e.dataTransfer && e.dataTransfer.files.length) addArquivos(e.dataTransfer.files);
  });
  inp.addEventListener('change', e => {
    if(e.target.files && e.target.files.length) addArquivos(e.target.files);
    inp.value = '';
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => e.preventDefault());

  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const box = $(btn.dataset.toggle);
      if(!box) return;
      box.classList.toggle('on');
      btn.textContent = box.classList.contains('on') ? '🙈' : '👁️';
    });
  });

  $('btnAddLixo').addEventListener('click', () => adicionarLixoManual(false));
  $('btnAddLixoAplicar').addEventListener('click', () => adicionarLixoManual(true));
  $('lixoManual').addEventListener('keydown', e => { if(e.key === 'Enter') adicionarLixoManual(false); });

  $('btnAddAbrev').addEventListener('click', adicionarAbrev);
  $('btnResetAbrev').addEventListener('click', resetarAbrev);
  $('abrevPara').addEventListener('keydown', e => { if(e.key === 'Enter') adicionarAbrev(); });

  $('btnAddArt').addEventListener('click', adicionarArtistaConhecido);
  $('btnAddArtAtual').addEventListener('click', adicionarArtistasDasMusicas);
  $('btnResetArt').addEventListener('click', resetarArtistas);
  $('btnZerarArt').addEventListener('click', zerarArtistas);
  $('btnExportArt').addEventListener('click', exportarArtistas);
  $('btnImportArt').addEventListener('click', importarArtistas);
  $('btnAddMassa').addEventListener('click', adicionarMassa);
  $('btnLimparMassa').addEventListener('click', () => { $('artMassa').value = ''; });
  $('artNovo').addEventListener('keydown', e => { if(e.key === 'Enter') adicionarArtistaConhecido(); });
  $('artBusca').addEventListener('input', e => {
    artBuscaAtual = e.target.value;
    renderArtistas();
  });
  $('btnLimparBusca').addEventListener('click', () => {
    $('artBusca').value = '';
    artBuscaAtual = '';
    renderArtistas();
  });
  $('btnAddAlias').addEventListener('click', adicionarAlias);
  $('aliasPara').addEventListener('keydown', e => { if(e.key === 'Enter') adicionarAlias(); });
  $('inpImportArt').addEventListener('change', e => {
    const f = e.target.files[0];
    if(f) processarImportArt(f);
    e.target.value = '';
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest('.chip button');
    if(!btn) return;
    if(btn.dataset.tab !== undefined){
      const k = btn.dataset.k;
      delete brain[btn.dataset.tab][k];
      if(btn.dataset.tab === 'lixo') _cacheHashLixo = '';
      salvarBrain();
      renderBrain();
      toast('Removido', 'i');
    } else if(btn.closest('#artLista')){
      const k = btn.dataset.k;
      const nome = artistasConhecidos[k];
      delete artistasConhecidos[k];
      _cacheHashArt = '';
      _dirtyArtistas = true;
      if(salvarArtistas()){ renderArtistas(); toast('🗑️ Removido: ' + nome, 'i'); }
    } else if(btn.closest('#aliasLista')){
      delete aliases[btn.dataset.k];
      salvarAliases();
      renderAliases();
      toast('Alias removido', 'i');
    } else if(btn.closest('#abrevLista')){
      delete abrev[btn.dataset.k];
      salvarAbrev();
      toast('Removido: ' + btn.dataset.k, 'i');
      if(musicas.length > 0){
        musicas.forEach(m => { m.newName = gerarNome(m, comExt(m.originalName)); });
        render();
      }
    }
  });

  $('corpo').addEventListener('input', onInputEdit);
  $('corpo').addEventListener('blur', onInputBlur, true);

  $('btnLimpar').addEventListener('click', limparTodos);
  $('btnReanalisar').addEventListener('click', reanalisar);
  $('btnReset').addEventListener('click', resetarCampos);
  $('btnClear').addEventListener('click', limparTudo);
  $('btnDemo').addEventListener('click', demo);
  $('btnZip').addEventListener('click', baixarZip);
  $('btnJson').addEventListener('click', baixarJson);
  $('btnGenero').addEventListener('click', aplicarGenero);
  $('btnCopyJson2').addEventListener('click', copiarJson);
  $('btnDownloadJson2').addEventListener('click', baixarJson);
  $('btnMinificar').addEventListener('click', toggleMinificar);

  $('btnToggleJson').addEventListener('click', () => {
    const p = $('jsonPainel');
    p.classList.toggle('on');
    $('btnToggleJson').textContent = p.classList.contains('on') ? '📋 Fechar' : '📋 JSON';
    if(p.classList.contains('on')) p.scrollIntoView({ behavior:'smooth' });
  });

  $('btnBrain').addEventListener('click', () => {
    const p = $('brainPainel');
    p.classList.toggle('on');
    if(p.classList.contains('on')){ renderBrain(); p.scrollIntoView({ behavior:'smooth' }); }
  });

  document.querySelectorAll('.brain-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.brain-tab').forEach(t => t.classList.remove('on'));
      tab.classList.add('on');
      brainTabAtual = tab.dataset.tab;
      renderBrain();
    });
  });

  $('btnExportBrain').addEventListener('click', exportarBrain);
  $('btnImportBrain').addEventListener('click', importarBrain);
  $('btnResetBrain').addEventListener('click', resetarBrain);

  $('inpBrain').addEventListener('change', e => {
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try{
        const obj = JSON.parse(ev.target.result);
        if(obj.brain){
          brain.lixo = obj.brain.lixo || {};
          brain.artistas = obj.brain.artistas || {};
          brain.titulos = obj.brain.titulos || {};
        }
        if(obj.abrev) abrev = obj.abrev;
        if(obj.aliases) aliases = obj.aliases;
        if(obj.artistas && Array.isArray(obj.artistas)){
          artistasConhecidos = {};
          obj.artistas.forEach(a => { artistasConhecidos[norm(a)] = a; });
        }
        _cacheHashLixo = '';
        _cacheHashArt = '';
        _dirtyArtistas = true;
        salvarBrain();
        salvarAbrev();
        salvarAliases();
        salvarArtistas();
        renderBrain();
        renderAliases();
        renderArtistas();
        toast('🧠 Cérebro importado!', 'save');
      }catch(err){ toast('Arquivo inválido.', 'e'); }
    };
    r.readAsText(f);
    e.target.value = '';
  });

  $('idInicial').addEventListener('input', atualizarJsonDebounced);
  $('generoGeral').addEventListener('input', atualizarJsonDebounced);

  window.addEventListener('beforeunload', () => {
    try{
      _dirtyArtistas = true;
      if(Object.keys(artistasConhecidos).length > 0) salvarArtistas();
      if(Object.keys(aliases).length > 0) salvarAliases();
      _salvarBrainReal();
    }catch(e){}
  });

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden'){
      try{
        _dirtyArtistas = true;
        salvarArtistas(); salvarAliases(); _salvarBrainReal();
      }catch(e){}
    }
  });

  // Salva só se sujo (economiza CPU/bateria)
  setInterval(() => {
    try{ if(_dirtyArtistas && Object.keys(artistasConhecidos).length > 0) salvarArtistas(); }catch(e){}
  }, 60000);

  setTimeout(() => {
    const ok = { JSZip: typeof JSZip !== 'undefined', ID3Writer: typeof ID3Writer !== 'undefined' };
    if(!ok.JSZip) toast('⚠️ JSZip não carregou', 'w');
    if(!ok.ID3Writer) toast('⚠️ ID3Writer não carregou', 'w');
  }, 500);

  console.log('🎵 Editor v11 iniciado | ' + Object.keys(artistasConhecidos).length + ' artistas | Mobile-ready');
  toast('💾 Salvamento blindado ativo!', 'save');
};

init();
})();
</script>
